<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Apple Body Gradient -->
    <radialGradient id="appleGradient" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="85%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </radialGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Hat Gradient -->
    <linearGradient id="hatGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="120" cy="216" rx="65" ry="14" fill="#0f172a" opacity="0.4" />

  <!-- Apple Stem -->
  <path d="M 120,70 Q 128,40 142,32 Q 138,48 126,72 Z" fill="#78350f" stroke="#451a03" stroke-width="2" />

  <!-- Green Leaf -->
  <path d="M 126,50 Q 160,32 170,55 Q 146,75 125,56 Z" fill="url(#leafGradient)" stroke="#166534" stroke-width="2.5" />
  <path d="M 128,52 Q 148,46 166,54" fill="none" stroke="#bbf7d0" stroke-width="1.5" stroke-linecap="round" />

  <!-- Apple Main Body -->
  <!-- Classic heart-apple silhouette -->
  <path d="M 120,82
           C 145,55 195,62 195,115
           C 195,165 158,205 125,210
           C 122,210.5 118,210.5 115,210
           C 82,205 45,165 45,115
           C 45,62 95,55 120,82 Z"
        fill="url(#appleGradient)"
        stroke="#7f1d1d"
        stroke-width="4.5"
        filter="url(#shadow)" />

  <!-- Apple Gloss / Specular Highlights -->
  <ellipse cx="78" cy="100" rx="18" ry="32" transform="rotate(-28, 78, 100)" fill="#ffffff" opacity="0.25" />
  <ellipse cx="70" cy="92" rx="7" ry="14" transform="rotate(-28, 70, 92)" fill="#ffffff" opacity="0.5" />

  <!-- Eye Patch Strap (across face) -->
  <path d="M 46,120 Q 120,132 194,116" fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" />

  <!-- Left Eye Patch (Pirate Eye Patch) -->
  <path d="M 72,120 Q 98,118 102,135 Q 98,158 78,154 Q 66,140 72,120 Z"
        fill="#0f172a" stroke="#334155" stroke-width="3" />
  <circle cx="85" cy="136" r="3" fill="#cbd5e1" opacity="0.7" />

  <!-- Right Eye (Expressive, cheeky pirate eye) -->
  <ellipse cx="145" cy="132" rx="17" ry="20" fill="#ffffff" stroke="#0f172a" stroke-width="3.5" />
  <!-- Iris -->
  <circle cx="146" cy="133" r="11" fill="#0284c7" />
  <!-- Pupil -->
  <circle cx="147" cy="133" r="7" fill="#0f172a" />
  <!-- Eye highlights -->
  <circle cx="143" cy="129" r="4" fill="#ffffff" />
  <circle cx="150" cy="136" r="1.8" fill="#ffffff" />
  <!-- Cheeky Eyebrow -->
  <path d="M 130,110 Q 146,98 165,108" fill="none" stroke="#450a0a" stroke-width="4.5" stroke-linecap="round" />

  <!-- Cute Rosy Cheek -->
  <ellipse cx="166" cy="154" rx="9" ry="5.5" fill="#f43f5e" opacity="0.45" />
  <ellipse cx="60" cy="148" rx="8" ry="5" fill="#f43f5e" opacity="0.35" />

  <!-- Grinning Pirate Mouth with Gold Tooth -->
  <path d="M 102,166 Q 122,188 152,168" fill="#450a0a" stroke="#0f172a" stroke-width="3.5" />
  <!-- Mouth interior (teeth) -->
  <path d="M 106,168 Q 122,180 148,170 Q 126,172 106,168 Z" fill="#ffffff" />
  <!-- Gold Tooth! -->
  <rect x="122" y="169" width="7" height="6.5" rx="1.5" fill="url(#goldGradient)" stroke="#854d0e" stroke-width="1.2" />

  <!-- Pirate Captain Hat (Tricorne) on Top -->
  <g id="pirateHat">
    <!-- Back Brim -->
    <path d="M 40,84 Q 120,40 200,84 Q 120,68 40,84 Z" fill="#0f172a" />
    
    <!-- Main Hat Crown -->
    <path d="M 50,86
             C 45,52 80,38 120,40
             C 160,38 195,52 190,86
             C 160,78 80,78 50,86 Z"
          fill="url(#hatGradient)"
          stroke="#0f172a"
          stroke-width="3.5" />

    <!-- Hat Front Curved Brim -->
    <path d="M 38,88
             C 75,68 165,68 202,88
             C 175,98 65,98 38,88 Z"
          fill="#1e293b"
          stroke="#0f172a"
          stroke-width="3" />

    <!-- Gold Brim Edge Trim -->
    <path d="M 38,88 C 75,68 165,68 202,88" fill="none" stroke="url(#goldGradient)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Skull & Crossbones Emblem on Hat -->
    <g id="hatSkull" transform="translate(120, 64) scale(0.75)">
      <!-- Crossbones -->
      <line x1="-12" y1="-10" x2="12" y2="10" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
      <line x1="-12" y1="10" x2="12" y2="-10" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
      <circle cx="-13" cy="-10" r="2.2" fill="#f8fafc" />
      <circle cx="13" cy="10" r="2.2" fill="#f8fafc" />
      <circle cx="-13" cy="10" r="2.2" fill="#f8fafc" />
      <circle cx="13" cy="-10" r="2.2" fill="#f8fafc" />

      <!-- Skull Head -->
      <ellipse cx="0" cy="-2" rx="9" ry="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
      <!-- Skull Eyes -->
      <circle cx="-3.5" cy="-2" r="2.2" fill="#0f172a" />
      <circle cx="3.5" cy="-2" r="2.2" fill="#0f172a" />
      <!-- Skull Nose & Teeth -->
      <path d="M 0,1 L -1,3 L 1,3 Z" fill="#0f172a" />
      <rect x="-4" y="3.5" width="8" height="4" rx="1" fill="#f8fafc" stroke="#0f172a" stroke-width="1" />
      <line x1="-1.5" y1="3.5" x2="-1.5" y2="7.5" stroke="#0f172a" stroke-width="1" />
      <line x1="1.5" y1="3.5" x2="1.5" y2="7.5" stroke="#0f172a" stroke-width="1" />
    </g>

    <!-- Red Pirate Feather / Bandana Knot Accent -->
    <path d="M 48,84 Q 30,65 34,48 Q 42,62 54,78 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2" />
    <path d="M 44,82 Q 38,62 48,54" fill="none" stroke="#fca5a5" stroke-width="1.5" />
  </g>

  <!-- Tiny Wooden Pirate Cutlass (Held at side) -->
  <g transform="translate(182, 142) rotate(22)">
    <!-- Saber Blade -->
    <path d="M 0,0 Q 8,-35 24,-45 Q 18,-20 8,0 Z" fill="#e2e8f0" stroke="#475569" stroke-width="2" />
    <!-- Gold Guard -->
    <path d="M -8,0 C 2,6 14,6 18,-4" fill="none" stroke="url(#goldGradient)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Wooden Grip -->
    <rect x="2" y="2" width="5" height="12" rx="1.5" fill="#78350f" stroke="#451a03" stroke-width="1.5" />
    <!-- Pommel -->
    <circle cx="4.5" cy="16" r="3" fill="url(#goldGradient)" />
  </g>
</svg>
